{% extends "portal_base.html" %}

{% block page_title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="glass-card p-5 text-center my-5" style="max-width: 600px; margin: 0 auto; border-left: 4px solid var(--accent-warning);">
    <div class="rounded-circle d-inline-flex align-items-center justify-content-center mb-4" style="width: 80px; height: 80px; background: rgba(245, 158, 11, 0.2); color: var(--accent-warning);">
        <i class="bi bi-file-earmark-x fs-1"></i>
    </div>
    <h3 class="h4 mb-2" style="color: var(--text-primary); font-weight: 700;">404 — Page Not Found</h3>
    <p class="mb-4" style="color: var(--text-muted);">
        The requested page or record could not be found in the LibrarySphere portal. It may have been moved or removed.
    </p>
    <div class="d-flex justify-content-center gap-3">
        <a href="{% url 'core:dashboard' %}" class="btn btn-primary px-4"><i class="bi bi-house me-1"></i> Return to Dashboard</a>
        <a href="{% url 'catalog:list' %}" class="btn btn-outline-secondary px-4" style="border-color: rgba(255,255,255,0.2); color: var(--text-secondary);">Browse Catalogue</a>
    </div>
</div>
{% endblock %}
