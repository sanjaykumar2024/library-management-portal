{% load static %}
<!-- Top Institutional Banner (Open Library & NDLI style) -->
<div class="institutional-topbar py-1 px-3 d-none d-md-block">
    <div class="container d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-3">
            <span class="fw-semibold"><i class="bi bi-bank2 me-1 text-primary"></i> <strong>LibrarySphere</strong> &bull; Public Digital &amp; Physical Library</span>
            <span class="opacity-50">|</span>
            <span class="small"><i class="bi bi-check-circle-fill me-1 text-success"></i> Free In-Browser E-Books &bull; Zero Waitlists</span>
        </div>
        <div class="d-flex align-items-center gap-3">
            {% if not user.is_authenticated %}
            <a href="{% url 'accounts:login' %}" class="text-decoration-none fw-semibold" style="font-size: 0.82rem; color: #02599C;">
                <i class="bi bi-key-fill me-1"></i> Demo Logins (Admin / Staff / Patron)
            </a>
            <span class="opacity-50">&bull;</span>
            {% endif %}
            <a href="{% url 'core:help' %}" class="text-decoration-none" style="font-size: 0.82rem; color: inherit;">
                <i class="bi bi-question-circle me-1"></i> Help &amp; FAQ
            </a>
            <span class="opacity-50">&bull;</span>
            <a href="{% url 'circulation:kiosk' %}" class="text-decoration-none" style="font-size: 0.82rem; color: inherit;">
                <i class="bi bi-upc-scan me-1"></i> Express Kiosk
            </a>
        </div>
    </div>
</div>
